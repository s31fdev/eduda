<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Опрос про игры</title>
    <style>
      :root {
        --bg: #f6f5fb;
        --card: #ffffff;
        --text: #1d1b2c;
        --muted: #6b6880;
        --line: #e3e0ef;
        --accent: #6c4cf5;
        --accent-soft: #ece7ff;
        --accent-text: #ffffff;
        --like: #12a150;
        --like-soft: #e2f7ea;
        --dislike: #d93a3a;
        --dislike-soft: #fde8e8;
        --error: #d93a3a;
        --shadow: 0 1px 2px rgb(20 10 60 / 6%), 0 4px 16px rgb(20 10 60 / 6%);
        --radius: 16px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #13121a;
          --card: #1d1c27;
          --text: #f1effa;
          --muted: #a29fb8;
          --line: #302e40;
          --accent: #8b72ff;
          --accent-soft: #2b2550;
          --accent-text: #ffffff;
          --like: #3ccf7a;
          --like-soft: #173826;
          --dislike: #ff6b6b;
          --dislike-soft: #3d1c1f;
          --error: #ff6b6b;
          --shadow: none;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.45 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 16px 16px 120px;
      }
      header.top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        padding: 12px 16px 8px;
        max-width: 640px;
        margin: 0 auto;
      }
      .progress {
        height: 8px;
        border-radius: 99px;
        background: var(--line);
        overflow: hidden;
      }
      .progress > div {
        height: 100%;
        background: var(--accent);
        border-radius: 99px;
        transition: width 0.3s ease;
      }
      .step-label {
        font-size: 13px;
        color: var(--muted);
        margin-top: 6px;
      }
      h1 {
        font-size: 28px;
        line-height: 1.2;
        margin: 8px 0 12px;
      }
      h2 {
        font-size: 24px;
        margin: 8px 0 4px;
      }
      .lead {
        color: var(--muted);
        margin: 0 0 20px;
      }
      .q {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 16px;
        margin: 16px 0;
      }
      .q.invalid {
        border-color: var(--error);
      }
      .q-title {
        font-weight: 650;
        font-size: 17px;
        margin: 0 0 4px;
      }
      .q-hint {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 12px;
      }
      .q-error {
        color: var(--error);
        font-size: 14px;
        margin-top: 10px;
      }
      .opts {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      }
      .opts.chips {
        grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
      }
      .opts.wide {
        grid-template-columns: 1fr;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        min-height: 48px;
        padding: 10px 12px;
        text-align: left;
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 12px;
        cursor: pointer;
        transition:
          border-color 0.12s,
          background 0.12s;
      }
      .opts.chips .opt {
        justify-content: center;
        font-weight: 600;
        padding: 10px 4px;
      }
      .opt:hover {
        border-color: var(--accent);
      }
      .opt.on {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .opt .emo {
        font-size: 24px;
        line-height: 1;
        flex: none;
      }
      .opt > span:last-child {
        min-width: 0;
        overflow-wrap: anywhere;
        hyphens: auto;
      }
      .opt small {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .opt:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .counter {
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
      }
      .theme {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 8px 8px 12px;
        border: 2px solid var(--line);
        border-radius: 12px;
      }
      .theme.like {
        border-color: var(--like);
        background: var(--like-soft);
      }
      .theme.dislike {
        border-color: var(--dislike);
        background: var(--dislike-soft);
      }
      .theme .name {
        flex: 1;
      }
      .theme button {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        border: 2px solid var(--line);
        background: var(--card);
        font-size: 20px;
        cursor: pointer;
      }
      .theme.like button.l {
        border-color: var(--like);
      }
      .theme.dislike button.d {
        border-color: var(--dislike);
      }
      .themes {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      }
      .ac {
        position: relative;
      }
      input[type='text'],
      textarea {
        width: 100%;
        font: inherit;
        color: var(--text);
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        outline: none;
      }
      input[type='text']:focus,
      textarea:focus {
        border-color: var(--accent);
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .suggest {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 4px);
        z-index: 10;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgb(0 0 0 / 15%);
        overflow: hidden;
      }
      .suggest button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 12px;
        border: 0;
        background: none;
        cursor: pointer;
      }
      .suggest button:hover,
      .suggest button.active {
        background: var(--accent-soft);
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 6px 6px 12px;
        border-radius: 99px;
        background: var(--accent-soft);
        border: 1px solid var(--accent);
        font-weight: 600;
      }
      .tag button {
        border: 0;
        background: none;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 2px 6px;
        color: var(--muted);
      }
      .none-btn {
        margin-top: 10px;
      }
      .scale {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }
      .scale .opt {
        flex-direction: column;
        justify-content: center;
        text-align: center;
        gap: 2px;
        padding: 8px 2px;
        font-size: 12px;
      }
      .idea {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 12px;
      }
      .idea .big {
        font-size: 44px;
        line-height: 1;
      }
      .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        background: var(--bg);
        border-top: 1px solid var(--line);
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      }
      .nav-inner {
        max-width: 640px;
        margin: 0 auto;
        display: flex;
        gap: 10px;
      }
      .btn {
        flex: 1;
        min-height: 52px;
        border-radius: 14px;
        border: 2px solid var(--line);
        background: var(--card);
        font-weight: 650;
        font-size: 17px;
        cursor: pointer;
      }
      .btn.primary {
        flex: 2;
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-text);
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      .hero {
        text-align: center;
        padding-top: 32px;
      }
      .hero .big {
        font-size: 72px;
        line-height: 1;
      }
      .facts {
        text-align: left;
        display: grid;
        gap: 10px;
        margin: 24px 0;
      }
      .facts div {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
      }
      .hp {
        position: absolute;
        left: -10000px;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>

    </header>

    <nav class="nav" id="nav" hidden>
      <div class="nav-inner">
        <button class="btn" id="back" type="button">Назад</button>
        <button class="btn primary" id="next" type="button">Дальше</button>
      </div>
    </nav>
    <div class="hp" aria-hidden="true">
      <label>Сайт <input type="text" id="website" tabindex="-1" autocomplete="off" /></label>
    </div>

      const SCALE = [
        { v: 1, emoji: '😴', label: 'Точно нет' },
        { v: 2, emoji: '😕', label: 'Скорее нет' },

      ]

      /* ---------- состояние ---------- */

      const STORE_KEY = 'games-survey-' + VERSION
      const has = (list, code) => Array.isArray(list) && list.includes(code)
      const playsYg = (a) => a.yg === 'sometimes' || a.yg === 'often'

      let state = freshState()

      function freshState() {
        return { screen: -1, answers: {}, order: {}, startedAt: Date.now() }
      }

      function save() {
        try {
          sessionStorage.setItem(STORE_KEY, JSON.stringify(state))
        } catch (e) {}
      }

      function restore() {
        try {
          const raw = sessionStorage.getItem(STORE_KEY)
          if (raw) state = { ...freshState(), ...JSON.parse(raw) }
        } catch (e) {}
      }

      function shuffled(q, options) {
        if (!q.shuffle) return options
        if (!state.order[q.id]) {
          const codes = options.filter((o) => !o.fixed && !o.exclusive).map((o) => o.code)
          for (let i = codes.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1))
            ;[codes[i], codes[j]] = [codes[j], codes[i]]
          }
          state.order[q.id] = codes
        }
        const order = state.order[q.id]
        const movable = options.filter((o) => order.includes(o.code))
        movable.sort((a, b) => order.indexOf(a.code) - order.indexOf(b.code))
        return [...movable, ...options.filter((o) => !order.includes(o.code))]
      }

      const visible = (q) => !q.showIf || q.showIf(state.answers)
      const optionsOf = (q) =>
        typeof q.options === 'function' ? q.options(state.answers) : q.options

      /* ---------- отрисовка ---------- */

      const app = document.getElementById('app')
      const el = (tag, attrs = {}, ...children) => {
        const node = document.createElement(tag)
        for (const [k, v] of Object.entries(attrs)) {
          if (k === 'class') node.className = v
          else if (k.startsWith('on')) node.addEventListener(k.slice(2), v)
          else if (v !== false && v != null) node.setAttribute(k, v === true ? '' : v)
        }
        for (const child of children.flat()) {
          if (child == null || child === false) continue
          node.append(child instanceof Node ? child : document.createTextNode(String(child)))
        }
        return node
      }

      function optionButton(o, on, onClick, disabled) {
        return el(
          'button',
          {
            type: 'button',
            class: 'opt' + (on ? ' on' : ''),
            'aria-pressed': String(on),
            onclick: onClick,
            disabled,
          },
          o.emoji ? el('span', { class: 'emo' }, o.emoji) : null,
          el('span', {}, o.label, o.sub ? el('small', {}, o.sub) : null),
        )
      }

      function renderSingle(q) {
        const value = state.answers[q.id]
        const options = shuffled(q, optionsOf(q))
        const layout = q.layout === 'chips' ? 'chips' : options.some((o) => o.emoji) ? '' : 'wide'
        return el(
          'div',
          { class: 'opts ' + layout },
          options.map((o) =>
            optionButton(o, value === o.code, () => {
              state.answers[q.id] = o.code
              update()
            }),
          ),
        )
      }

      function renderMulti(q) {
        const value = state.answers[q.id] || []
        const options = shuffled(q, optionsOf(q))
        const full = q.max && value.length >= q.max
        const box = el(
          'div',
          { class: 'opts' },
          options.map((o) => {
            const on = value.includes(o.code)
            return optionButton(
              o,
              on,
              () => {
                let next
                if (on) next = value.filter((c) => c !== o.code)
                else if (o.exclusive) next = [o.code]
                else
                  next = [
                    ...value.filter((c) => !options.find((x) => x.code === c)?.exclusive),
                    o.code,
                  ]
                state.answers[q.id] = next
                update()
              },
              !on && full && !o.exclusive,
            )
          }),
        )
        return [
          box,
          q.max ? el('div', { class: 'counter' }, `Выбрано ${value.length} из ${q.max}`) : null,
        ]
      }

      const norm = (s) =>
        s
          .toLowerCase()
          .replace(/ё/g, 'е')
          .replace(/[^a-zа-я0-9]+/g, ' ')
          .trim()
      const GAME_INDEX = GAMES.map(([code, name, aliases]) => ({
        code,
        name,
        hay: ' ' + norm(name + ' ' + aliases),
      }))
      const gameName = (code) =>
        code.startsWith('other:')
          ? code.slice(6)
          : (GAMES.find((g) => g[0] === code) || [, code])[1]

      function searchGames(text, taken) {
        const t = norm(text)
        if (!t) return []
        // Совпадение с начала слова: «кс» не должно находить «роблокс».
        return GAME_INDEX.filter((g) => !taken.includes(g.code) && g.hay.includes(' ' + t)).slice(
          0,
          6,
        )
      }

      function renderGames(q) {
        const max = 3
        const noneCode = q.noneCode || 'none'
        const value = state.answers[q.id] || []
        const isNone = value.length === 1 && value[0] === noneCode
        const parts = []

        const picked = isNone ? [] : value
        if (picked.length) {
          parts.push(
            el(
              'div',
              { class: 'tags' },
              picked.map((code) =>
                el(
                  'span',
                  { class: 'tag' },
                  gameName(code),
                  el(
                    'button',
                    {
                      type: 'button',
                      'aria-label': 'Убрать',
                      onclick: () => {
                        state.answers[q.id] = picked.filter((c) => c !== code)
                        update()
                      },
                    },
                    '×',
                  ),
                ),
              ),
            ),
          )
        }

        if (!isNone && picked.length < max) {
          const input = el('input', {
            type: 'text',
            placeholder: picked.length ? 'Ещё игра…' : 'Например, Minecraft',
            autocomplete: 'off',
            enterkeyhint: 'done',
            'data-focus': q.id,
          })
          const list = el('div', { class: 'suggest', hidden: true })
          let items = []
          let active = 0
          const add = (code) => {
            state.answers[q.id] = [...picked, code]
            state.focus = q.id
            update()
          }
          const draw = () => {
            const text = input.value.trim()
            const found = searchGames(text, picked)
            items = found.map((g) => ({ code: g.code, label: g.name }))
            if (text.length >= 2 && !found.some((g) => norm(g.name) === norm(text))) {
              items.push({
                code: 'other:' + text.slice(0, 60),
                label: `Добавить «${text.slice(0, 60)}»`,
              })
            }
            active = Math.min(active, Math.max(items.length - 1, 0))
            list.replaceChildren(
              ...items.map((it, i) =>
                el(
                  'button',
                  {
                    type: 'button',
                    class: i === active ? 'active' : '',
                    onmousedown: (e) => e.preventDefault(),
                    onclick: () => add(it.code),
                  },
                  it.label,
                ),
              ),
            )
            list.hidden = items.length === 0
          }
          input.addEventListener('input', () => {
            active = 0
            draw()
          })
          input.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') active = Math.min(active + 1, items.length - 1)
            else if (e.key === 'ArrowUp') active = Math.max(active - 1, 0)
            else if (e.key === 'Enter') {
              e.preventDefault()
              if (items[active]) add(items[active].code)
              return
            } else return
            e.preventDefault()
            draw()
          })
          input.addEventListener('blur', () => setTimeout(() => (list.hidden = true), 150))
          input.addEventListener('focus', draw)
          parts.push(el('div', { class: 'ac' }, input, list))
        }

        if (!picked.length) {
          parts.push(
            el(
              'div',
              { class: 'none-btn' },
              optionButton(opt(noneCode, q.none, '🚫'), isNone, () => {
                state.answers[q.id] = isNone ? [] : [noneCode]
                update()
              }),
            ),
          )
        }
        return parts
      }

      function renderThemes(q) {
        const like = state.answers.themes_like || []
        const dislike = state.answers.themes_dislike || []
        const set = (code, kind) => {
          const l = like.filter((c) => c !== code)
          const d = dislike.filter((c) => c !== code)
          const wasOn = (kind === 'l' ? like : dislike).includes(code)
          if (!wasOn) (kind === 'l' ? l : d).push(code)
          state.answers.themes_like = l
          state.answers.themes_dislike = d
          update()
        }
        return el(
          'div',
          { class: 'themes' },
          shuffled(q, q.options).map((o) => {
            const mood = like.includes(o.code)
              ? ' like'
              : dislike.includes(o.code)
                ? ' dislike'
                : ''
            return el(
              'div',
              { class: 'theme' + mood },
              el('span', { class: 'emo' }, o.emoji),
              el('span', { class: 'name' }, o.label),
              el(
                'button',
                {
                  type: 'button',
                  class: 'l',
                  'aria-label': 'Нравится',
                  onclick: () => set(o.code, 'l'),
                },
                '👍',
              ),
              el(
                'button',
                {
                  type: 'button',
                  class: 'd',
                  'aria-label': 'Не нравится',
                  onclick: () => set(o.code, 'd'),
                },
                '👎',
              ),
            )
          }),
        )
      }

      function renderIdeas() {
        return IDEAS.map((idea) => {
          const key = 'idea_' + idea.id
          const value = state.answers[key]
          return el(
            'section',
            { class: 'q', 'data-q': key },
            el(
              'div',
              { class: 'idea' },
              el('span', { class: 'big' }, idea.emoji),
              el(
                'div',
                {},
                el('p', { class: 'q-title' }, idea.title),
                el('p', { class: 'q-hint' }, idea.text),
              ),
            ),
            el(
              'div',
              { class: 'scale' },
              SCALE.map((s) =>
                optionButton({ code: s.v, label: s.label, emoji: s.emoji }, value === s.v, () => {
                  state.answers[key] = s.v
                  update()
                }),
              ),
            ),
            el('div', { class: 'q-error', hidden: true }, 'Оцени эту идею'),
          )
        })
      }

      function renderText(q) {
        const area = el('textarea', {
          maxlength: 500,
          placeholder: q.placeholder || '',
          'data-focus': q.id,
        })
        area.value = state.answers[q.id] || ''
        area.addEventListener('input', () => {
          state.answers[q.id] = area.value
          save()
        })
        return area
      }

      const RENDER = {
        single: renderSingle,
        multi: renderMulti,
        games: renderGames,
        themes: renderThemes,
        text: renderText,
      }

      function renderQuestion(q) {
        if (q.type === 'ideas') return renderIdeas()
        return el(
          'section',
          { class: 'q', 'data-q': q.id },
          el('p', { class: 'q-title' }, q.title),
          q.hint ? el('p', { class: 'q-hint' }, q.hint) : null,
          RENDER[q.type](q),
          el('div', { class: 'q-error', hidden: true }, errorText(q)),
        )
      }

      function errorText(q) {
        if (q.type === 'themes') return 'Отметь хотя бы одну тему, которая нравится'
        if (q.type === 'games') return 'Выбери игру или нажми кнопку ниже'
        return 'Ответь на этот вопрос'
      }

      /* ---------- экраны ---------- */

      const topBar = document.getElementById('top')
      const nav = document.getElementById('nav')
      const backBtn = document.getElementById('back')
      const nextBtn = document.getElementById('next')

      function update() {
        save()
        const scrollY = window.scrollY
        render()
        window.scrollTo(0, scrollY)
      }

      function render() {
        const i = state.screen
        if (i < 0) return renderIntro()
        if (i >= SCREENS.length) return renderDone()

        const screen = SCREENS[i]
        topBar.hidden = false
        nav.hidden = false
        document.getElementById('bar').style.width = `${Math.round((i / SCREENS.length) * 100)}%`
        document.getElementById('step').textContent = `Шаг ${i + 1} из ${SCREENS.length}`
        backBtn.hidden = false
        nextBtn.textContent = i === SCREENS.length - 1 ? 'Отправить' : 'Дальше'

        app.replaceChildren(
          ...[
            el('h2', {}, `${screen.emoji} ${screen.title}`),
            screen.lead ? el('p', { class: 'lead' }, screen.lead) : null,
            ...screen.questions.filter(visible).flatMap((q) => renderQuestion(q)),
          ].filter(Boolean),
        )

        if (state.focus) {
          const input = app.querySelector(`[data-focus="${state.focus}"]`)
          state.focus = null
          if (input) input.focus({ preventScroll: true })
        }
      }

      function renderIntro() {
        topBar.hidden = true
        nav.hidden = true
        app.replaceChildren(
          el(
            'div',
            { class: 'hero' },
            el('div', { class: 'big' }, '🎮'),
            el('h1', {}, 'Опрос про игры'),
            el(
              'p',
              { class: 'lead' },
              'Мы хотим сделать игру, в которую тебе будет интересно играть. Расскажи, во что ты играешь и что тебе нравится.',
            ),
            el(
              'div',
              { class: 'facts' },
              el('div', {}, '🕵️ Анонимно: мы не спрашиваем имя и не знаем, кто что ответил'),
              el('div', {}, '⏱️ Займёт около 8 минут, 10 коротких шагов'),
              el('div', {}, '✅ Правильных ответов нет — отвечай, как есть'),
            ),
            el(
              'button',
              {
                type: 'button',
                class: 'btn primary',
                style: 'width:100%',
                onclick: () => {
                  state.startedAt = Date.now()
                  go(0)
                },
              },
              'Начать',
            ),
          ),
        )
      }

      function renderDone() {
        topBar.hidden = true
        nav.hidden = true
        app.replaceChildren(
          el(
            'div',
            { class: 'hero' },
            el('div', { class: 'big' }, '🎉'),
            el('h1', {}, 'Спасибо!'),
            el(
              'p',
              { class: 'lead' },
              'Ответы отправлены. Если за этим компьютером будет отвечать кто-то ещё, нажми кнопку ниже.',
            ),
            el(
              'button',
              {
                type: 'button',
                class: 'btn',
                style: 'width:100%',
                onclick: () => {
                  state = freshState()
                  update()
                },
              },
              'Новая анкета',
            ),
          ),
        )
      }

      function go(i) {
        state.screen = i
        save()
        render()
        window.scrollTo(0, 0)
      }

      function isAnswered(q) {
        const a = state.answers
        if (q.optional) return true
        if (q.type === 'themes') return (a.themes_like || []).length > 0
        if (q.type === 'text') return !!(a[q.id] || '').trim()
        if (q.type === 'multi' || q.type === 'games')
          return Array.isArray(a[q.id]) && a[q.id].length > 0
        return a[q.id] != null && a[q.id] !== ''
      }

      function validate() {
        const screen = SCREENS[state.screen]
        let first = null
        const mark = (key, ok) => {
          const box = app.querySelector(`[data-q="${key}"]`)
          if (!box) return
          box.classList.toggle('invalid', !ok)
          box.querySelector('.q-error').hidden = ok
          if (!ok && !first) first = box
        }
        for (const q of screen.questions.filter(visible)) {
          if (q.type === 'ideas') {
            for (const idea of IDEAS)
              mark('idea_' + idea.id, state.answers['idea_' + idea.id] != null)
          } else {
            mark(q.id, isAnswered(q))
          }
        }
        if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' })
        return !first
      }

      /** Только ответы на вопросы, которые ребёнок видел. */
      function collectAnswers() {
        const a = state.answers
        const out = {}
        const group = new URLSearchParams(location.search).get('g')
        if (group) out.group = group.slice(0, 40)
        for (const screen of SCREENS) {
          for (const q of screen.questions) {
            if (!visible(q)) continue
            if (q.type === 'ideas') {
              for (const idea of IDEAS)
                if (a['idea_' + idea.id] != null) out['idea_' + idea.id] = a['idea_' + idea.id]
            } else if (q.type === 'themes') {
              out.themes_like = a.themes_like || []
              out.themes_dislike = a.themes_dislike || []
            } else if (q.type === 'text') {
              const text = (a[q.id] || '').trim()
              if (text) out[q.id] = text
            } else if (a[q.id] != null) {
              out[q.id] = a[q.id]
            }
          }
        }
        // Один жанр — он и любимый: отдельный вопрос в этом случае не задаётся.
        if (Array.isArray(a.genres) && a.genres.length === 1) out.genre_fav = a.genres[0]
        return out
      }

      async function submit() {
        nextBtn.disabled = true
        nextBtn.textContent = 'Отправляю…'
        const body = {
          version: VERSION,
          durationSeconds: Math.min(86400, Math.round((Date.now() - state.startedAt) / 1000)),
          answers: collectAnswers(),
          website: document.getElementById('website').value,
        }
        try {
          const res = await fetch(ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          })
          if (!res.ok) throw new Error('HTTP ' + res.status)
          go(SCREENS.length)
        } catch (e) {
          alert('Не получилось отправить ответы. Проверь интернет и нажми «Отправить» ещё раз.')
        } finally {
          nextBtn.disabled = false
          if (state.screen === SCREENS.length - 1) nextBtn.textContent = 'Отправить'
        }
      }

      backBtn.addEventListener('click', () => go(state.screen - 1))
      nextBtn.addEventListener('click', () => {
        if (!validate()) return
        if (state.screen === SCREENS.length - 1) submit()
        else go(state.screen + 1)
      })

      restore()
      render()
    </script>
  </body>
</html>
